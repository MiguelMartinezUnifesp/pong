[project]
name = "pong"
version = "0.1.0"
description = "Jogo Pong para dois jogadores com Python, PyQt6 e POO"
readme = "README.md"
authors = [
    { name = "Miguel Martinez", email = "miguel@chatvolt.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "pyqt6>=6.12.1",
]

[project.scripts]
pong = "pong:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
